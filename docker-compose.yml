version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quickstore_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-quickstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quickstore123}
      POSTGRES_DB: ${DB_NAME:-quickstore_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/platform/001_create_platform_tables.sql:/docker-entrypoint-initdb.d/01_platform.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quickstore_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickstore_api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quickstore}
      DB_PASSWORD: ${DB_PASSWORD:-quickstore123}
      DB_NAME: ${DB_NAME:-quickstore_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefreshkey}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-quickstore-assets}
      BASE_DOMAIN: ${BASE_DOMAIN:-quickstore.in}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  web:
    build:
      context: ../quickstore-frontend
      dockerfile: Dockerfile
    container_name: quickstore_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/v1}
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
